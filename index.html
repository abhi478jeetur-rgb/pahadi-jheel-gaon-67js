<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>पहाड़ी झील गाँव — 67js 3D Scene</title>
<style>
  html, body { margin: 0; height: 100%; background: #10131c; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; }
  #scene { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  .card { position: fixed; left: 16px; top: 16px; color: #f3ead9; z-index: 5;
    background: rgba(12, 14, 22, .55); border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(6px); max-width: 78vw; }
  .card h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: .2px; }
  .card p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  .hint { position: fixed; right: 16px; bottom: 14px; color: #e8e2d2; z-index: 5;
    background: rgba(12, 14, 22, .5); border-radius: 999px; padding: 6px 12px;
    font-size: 12.5px; border: 1px solid rgba(255,255,255,.12); }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #f3ead9; font-size: 17px; z-index: 9; background: #10131c; text-align: center; padding: 20px; }
  #status.err { color: #ffb4a2; font-size: 15px; line-height: 1.55; }
</style>
<script type="importmap">
{
  "imports": {
    "67js": "./build/67.module.js",
    "67js/addons/agent-scene": "./build/agent-scene.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div class="card">
  <h1>🏔️ पहाड़ी झील गाँव</h1>
  <p>67js (WebGL2) से बना 3D scene — शाम का समय, झील किनारे बसा गाँव</p>
</div>
<div class="hint">खींचकर घुमाओ &nbsp;•&nbsp; स्क्रॉल / पिंच से ज़ूम</div>
<div id="status">Scene load हो रहा है…</div>

<script type="module">
const statusEl = document.getElementById('status');
const fail = (msg) => {
  statusEl.className = 'err';
  statusEl.textContent = msg;
};

try {
  const [{ Renderer67 }, agent] = await Promise.all([
    import('67js'),
    import('67js/addons/agent-scene'),
  ]);
  const { createAgentScene, loadAllAgentSceneModules, resolveAgentShadow } = agent;

  const recipe = await (await fetch('scene.json')).json();
  await loadAllAgentSceneModules();
  const scene = createAgentScene(recipe);

  const canvas = document.getElementById('scene');
  const renderer = new Renderer67(canvas, scene.parts, {
    ground: false, hdr: true, depth: true, samples: 4, memoryBudgetMiB: 256,
    world: scene.environment?.world,
    environment: scene.environment,
    shadowBounds: resolveAgentShadow(scene.shadow, scene.environment?.lightDirection),
  });

  // कैमरा: recipe के eye/target से orbit
  const target = [...scene.camera.target];
  const off = [
    scene.camera.eye[0] - target[0],
    scene.camera.eye[1] - target[1],
    scene.camera.eye[2] - target[2],
  ];
  let radius = Math.hypot(...off);
  let theta = Math.atan2(off[0], off[2]);
  let phi = Math.acos(Math.min(1, Math.max(-1, off[1] / radius)));
  let autoRotate = true;

  const fit = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    renderer.resize();
  };
  window.addEventListener('resize', fit);
  fit();

  let dragging = false, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true; lx = e.clientX; ly = e.clientY; autoRotate = false;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    theta -= (e.clientX - lx) * 0.005;
    phi = Math.min(1.45, Math.max(0.15, phi - (e.clientY - ly) * 0.005));
    lx = e.clientX; ly = e.clientY;
  });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault(); autoRotate = false;
    radius = Math.min(160, Math.max(14, radius * (e.deltaY > 0 ? 1.1 : 0.9)));
  }, { passive: false });

  renderer.shadowsDirty = true;
  const start = performance.now();
  let firstFrame = true;

  const loop = () => {
    const t = (performance.now() - start) / 1000;
    if (autoRotate) theta += 0.00045 * 16.7;
    if (typeof scene.sampleMotion === 'function') {
      try { scene.sampleMotion(t); renderer.updateParts(scene.parts); renderer.shadowsDirty = true; } catch {}
    }
    const eye = [
      target[0] + radius * Math.sin(phi) * Math.sin(theta),
      target[1] + radius * Math.cos(phi),
      target[2] + radius * Math.sin(phi) * Math.cos(theta),
    ];
    renderer.render({
      ...scene.camera, eye, target,
      environment: scene.environment, effects: scene.effects,
      exposure: scene.effects?.exposure, time: t,
    });
    if (firstFrame) {
      firstFrame = false;
      statusEl.style.display = 'none';
      window.__sceneReady = true;
    }
    requestAnimationFrame(loop);
  };
  loop();
} catch (err) {
  console.error(err);
  fail('Scene load नहीं हो पाया।\nइस browser में WebGL2 चाहिए — Chrome/Edge के नए version में खोलकर देखो।\n(' + (err?.message || err) + ')');
}
</script>
</body>
</html>
